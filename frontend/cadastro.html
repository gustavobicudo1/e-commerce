    <hr>
    <main>
        <center>
            <h2>Cadastro Interdimensional</h2>
            <form action="cadastro" method="post" enctype="multipart/form-data" style="text-align: left; display: inline-block;">
                <label for="nome">Nome Completo (ou espécie):</label><br>
                <input type="text" id="nome" name="nome" minlength="5" required><br>
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" required><br>
                <label for="telefone">Telefone / Comunicador:</label><br>
                <input type="tel" id="telefone" name="telefone" pattern="[0-9]{2}-[0-9]{5}-[0-9]{4}" title="Formato obrigatório: 11-99999-9999" required><br>
                <p>Dimensão de Origem:</p>
                <input type="radio" id="dim3" name="dimensao" value="3D" required>
                <label for="dim3">3ª Dimensão (Euclidiana comum)</label><br>
                <input type="radio" id="dim4" name="dimensao" value="4D">
                <label for="dim4">4ª Dimensão (Viajante do Tempo)</label><br>
                <label for="estado">Estado (UF / Região Espacial):</label><br>
                <select id="estado" name="estado">
                    <option>nenhum registrado</option>
                    <option value="SP">Gustavo</option>
                    <option value="RJ">Rio de Janeiro 2</option>
                    <option value="MG">Andrômeda</option>
                    <option value="VOID">O Vazio</option>
                </select><br>
                <p>Selecione seus interesses:</p>
                <input type="checkbox" id="int1" name="interesses" value="dobra_espacial">
                <label for="int1">Dobra Espacial</label><br>
                <input type="checkbox" id="int2" name="interesses" value="singularidades">
                <label for="int2">Coleção de Singularidades</label><br><br>
                <label for="documento">Envie seu certificado de não-paradoxo temporal (PDF, PNG, JPG):</label><br>
                <input type="file" id="documento" name="documento" accept=".pdf, .png, .jpeg, .jpg"><br>
                <label for="mensagem">Deixe uma mensagem ou relato de anomalia:</label><br>
                <textarea id="mensagem" name="mensagem" rows="5" cols="40" placeholder="Descreva o que procura..."></textarea><br>
                <input type="checkbox" id="termos" name="termos" required>
                <label for="termos">Declaro que assumo o risco caso minha linha do tempo colapse.</label><br>
                <center>
                    <button type="submit">Enviar Registro</button>
                </center>
            </form>
        </center>
    </main>
    <hr>
    <footer>
            <h6>Os itens são exclusivos para seres que se venceram o super filtro e com intelecto nível 100</h6>
    </footer>
